<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tower Bridge Live Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent-blue: #0056b3;
            --success-green: #28a745;
            --warning-orange: #ffc107;
            --danger-red: #dc3545;
            --recovery-purple: #6f42c1;
            --border-radius: 8px;
            --shadow: 0 4px 6px rgba(0,0,0,0.1);
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            padding: 20px;
            min-height: 100vh;
        }

        .dashboard-container {
            max-width: 1200px;
            margin: 0 auto;
        }

        header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 24px;
            padding-bottom: 16px;
            border-bottom: 2px solid #e0e0e0;
        }

        h1 {
            font-size: 1.8rem;
            color: var(--text-primary);
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .status-badge {
            padding: 6px 12px;
            border-radius: 20px;
            font-size: 0.85rem;
            font-weight: 600;
            display: flex;
            align-items: center;
            gap: 6px;
            box-shadow: var(--shadow);
        }

        .status-dot {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: currentColor;
            display: inline-block;
        }

        /* Grid Layout */
        .metrics-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(240px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .metric-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
            transition: transform 0.2s ease;
            position: relative;
            overflow: hidden;
        }

        .metric-card:hover {
            transform: translateY(-2px);
        }

        .metric-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 0.5px;
            margin-bottom: 8px;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            color: var(--text-primary);
        }

        .metric-unit {
            font-size: 1rem;
            color: var(--text-secondary);
            font-weight: 400;
        }

        /* Specific Card Styles */
        .card-traffic .metric-value { color: var(--accent-blue); }
        .card-speed .metric-value { color: var(--success-green); }
        .card-congestion .metric-value { color: var(--danger-red); }
        .card-incidents .metric-value { color: var(--text-primary); }

        /* Status Indicators */
        .status-indicator {
            margin-top: 10px;
            font-size: 0.8rem;
            display: flex;
            align-items: center;
            gap: 6px;
        }

        .indicator-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: #ccc;
        }

        /* Visualizations */
        .visual-container {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .chart-card {
            background: var(--card-bg);
            border-radius: var(--border-radius);
            padding: 20px;
            box-shadow: var(--shadow);
        }

        .traffic-flow-bar {
            display: flex;
            align-items: center;
            margin-bottom: 12px;
            height: 40px;
        }

        .flow-label {
            width: 80px;
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-align: right;
            padding-right: 15px;
        }

        .flow-bar-bg {
            flex-grow: 1;
            height: 24px;
            background-color: #eee;
            border-radius: 12px;
            overflow: hidden;
            position: relative;
        }

        .flow-bar-fill {
            height: 100%;
            width: 0%;
            transition: width 0.5s ease-out;
            border-radius: 12px;
        }

        /* Animations */
        @keyframes pulse-green {
            0% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(40, 167, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(40, 167, 69, 0); }
        }

        .connected .status-dot { background-color: var(--success-green); color: var(--success-green); }
        .connected .status-indicator { color: var(--success-green); }
        
        @keyframes pulse-red {
            0% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(220, 53, 69, 0); }
            100% { box-shadow: 0 0 0 0 rgba(220, 53, 69, 0); }
        }

        .disconnected .status-dot { background-color: var(--danger-red); color: var(--danger-red); }
        .disconnected .status-indicator { color: var(--danger-red); }

        @keyframes pulse-purple {
            0% { box-shadow: 0 0 0 0 rgba(111, 66, 193, 0.4); }
            70% { box-shadow: 0 0 0 10px rgba(111, 66, 193, 0); }
            100% { box-shadow: 0 0 0 0 rgba(111, 66, 193, 0); }
        }

        .recovering .status-dot { background-color: var(--recovery-purple); color: var(--recovery-purple); }
        .recovering .status-indicator { color: var(--recovery-purple); }

        /* Responsive */
        @media (max-width: 768px) {
            header { flex-direction: column; align-items: flex-start; gap: 12px; }
            h1 { font-size: 1.5rem; }
            .metrics-grid { grid-template-columns: 1fr; }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <h1>
            <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#0056b3" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
                <path d="M19 17h2c.6 0 1-.4 1-1v-3c0-.9-.7-1.7-1.5-1.9C18.7 9.6 16.3 9 12 9c-4.3 0-6.7.6-7.5 1.1-.8.2-1.5 1-1.5 1.9v3c0 .6.4 1 1 1h2"/>
                <circle cx="7" cy="17" r="2"/>
                <circle cx="17" cy="17" r="2"/>
                <path d="M5 17v-3a2 2 0 0 1 2-2h10a2 2 0 0 1 2 2v3"/>
            </svg>
            Tower Bridge Live
        </h1>
        <div id="connection-status" class="status-badge disconnected">
            <span class="status-dot"></span>
            <span id="status-text">Connecting...</span>
        </div>
    </header>

    <!-- Metric Cards -->
    <div class="metrics-grid">
        <!-- Traffic Volume -->
        <div class="metric-card card-traffic">
            <div class="metric-label">Traffic Volume</div>
            <div class="metric-value" id="traffic-volume">0<span class="metric-unit"> veh/hr</span></div>
            <div class="status-indicator">
                <span class="indicator-dot"></span>
                <span id="traffic-trend">Stable</span>
            </div>
        </div>

        <!-- Average Speed -->
        <div class="metric-card card-speed">
            <div class="metric-label">Average Speed</div>
            <div class="metric-value" id="avg-speed">0<span class="metric-unit"> mph</span></div>
            <div class="status-indicator">
                <span class="indicator-dot"></span>
                <span id="speed-status">Normal Flow</span>
            </div>
        </div>

        <!-- Congestion Level -->
        <div class="metric-card card-congestion">
            <div class="metric-label">Congestion Level</div>
            <div class="metric-value" id="congestion-level">0<span class="metric-unit">%</span></div>
            <div class="status-indicator">
                <span class="indicator-dot"></span>
                <span id="congestion-status">Clear</span>
            </div>
        </div>

        <!-- Incident Count -->
        <div class="metric-card card-incidents">
            <div class="metric-label">Active Incidents</div>
            <div class="metric-value" id="incident-count">0</div>
            <div class="status-indicator">
                <span class="indicator-dot"></span>
                <span id="incident-desc">None Reported</span>
            </div>
        </div>
    </div>

    <!-- Visualizations -->
    <div class="visual-container">
        <div class="chart-card">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Real-time Flow (Northbound)</h3>
            <div id="flow-chart-nb">
                <!-- Bars injected via JS -->
            </div>
        </div>
        <div class="chart-card">
            <h3 style="margin-bottom: 15px; font-size: 1.1rem;">Real-time Flow (Southbound)</h3>
            <div id="flow-chart-sb">
                <!-- Bars injected via JS -->
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration
    const UPDATE_INTERVAL = 3000; // 3 seconds
    const MAX_TRAFFIC = 12000; // Max vehicles per hour for scale
    
    // State
    let isConnected = false;
    let trafficVolume = 0;
    let avgSpeed = 0;
    let congestionLevel = 0;
    let incidentCount = 0;
    
    // DOM Elements
    const els = {
        statusBadge: document.getElementById('connection-status'),
        statusText: document.getElementById('status-text'),
        trafficVol: document.getElementById('traffic-volume'),
        speedVal: document.getElementById('avg-speed'),
        congVal: document.getElementById('congestion-level'),
        incVal: document.getElementById('incident-count'),
        trafficTrend: document.getElementById('traffic-trend'),
        speedStatus: document.getElementById('speed-status'),
        congStatus: document.getElementById('congestion-status'),
        incDesc: document.getElementById('incident-desc'),
        flowNb: document.getElementById('flow-chart-nb'),
        flowSb: document.getElementById('flow-chart-sb')
    };

    // Initialize Charts with empty bars
    function initCharts() {
        const createBar = (id, label) => `
            <div class="traffic-flow-bar">
                <div class="flow-label">${label}</div>
                <div class="flow-bar-bg">
                    <div class="flow-bar-fill" style="width: 0%; background-color: #0056b3;"></div>
                </div>
            </div>
        `;
        
        els.flowNb.innerHTML = createBar('nb', 'Northbound');
        els.flowSb.innerHTML = createBar('sb', 'Southbound');
    }

    // Simulation Logic
    function simulateData() {
        if (!isConnected) return;

        // 1. Simulate Traffic Volume (Random walk with drift)
        const change = Math.floor(Math.random() * 50) - 20; // -20 to +30
        trafficVolume += change;
        if (trafficVolume < 0) trafficVolume = 0;
        if (trafficVolume > MAX_TRAFFIC) trafficVolume = MAX_TRAFFIC;

        // 2. Simulate Speed (Inverse to congestion)
        // Base speed 45mph, drops as congestion rises
        const baseSpeed = 45;
        avgSpeed = Math.max(10, baseSpeed - (congestionLevel * 0.3));

        // 3. Simulate Congestion Level
        // Fluctuates based on traffic volume relative to max capacity
        const capacityRatio = trafficVolume / MAX_TRAFFIC;
        congestionLevel = Math.min(100, Math.max(0, (capacityRatio * 80) + (Math.random() * 20 - 10)));

        // 4. Simulate Incidents (Rare events)
        if (Math.random() > 0.95 && incidentCount === 0) {
            const incidents = ['Minor Accident', 'Road Work', 'Emergency Stop', 'Weather Delay'];
            const randomIncident = incidents[Math.floor(Math.random() * incidents.length)];
            incidentCount++;
            els.incDesc.textContent = randomIncident;
        } else if (Math.random() > 0.98) {
            // Resolve incident
            if (incidentCount > 0) {
                incidentCount--;
                els.incDesc.textContent = incidentCount === 0 ? "None Reported" : `${incidentCount} Active`;
            }
        }

        updateUI();
    }

    function updateUI() {
        // Update Text Values
        els.trafficVol.innerHTML = Math.round(trafficVolume) + '<span class="metric-unit"> veh/hr</span>';
        els.speedVal.innerHTML = Math.round(avgSpeed) + '<span class="metric-unit"> mph</span>';
        els.congVal.innerHTML = Math.round(congestionLevel) + '<span class="metric-unit">%</span>';
        els.incVal.textContent = incidentCount;

        // Update Status Text
        els.trafficTrend.textContent = change > 0 ? 'Increasing' : (change < 0 ? 'Decreasing' : 'Stable');
        
        // Speed Status Logic
        if (avgSpeed < 25) {
            els.speedStatus.textContent = 'Heavy Congestion';
            els.speedStatus.style.color = '#dc3545';
        } else if (avgSpeed < 35) {
            els.speedStatus.textContent = 'Moderate Traffic';
            els.speedStatus.style.color = '#ffc1
