<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Myles AI Workspace</title>
    <style>
        body { font-family: 'Segoe UI', sans-serif; background: #f4f4f9; display: flex; justify-content: center; align-items: center; height: 100vh; margin: 0; }
        .dashboard { background: white; padding: 2rem; border-radius: 8px; box-shadow: 0 4px 6px rgba(0,0,0,0.1); text-align: center; width: 300px; }
        .status-dot { height: 12px; width: 12px; background-color: #2ecc71; border-radius: 50%; display: inline-block; margin-right: 8px; box-shadow: 0 0 8px #2ecc71; }
        .cycle-id { font-family: monospace; color: #555; margin-top: 1rem; }
    </style>
</head>
<body>
    <div class="dashboard">
        <h3>Myles AI Local</h3>
        <p><span class="status-dot"></span>System Ready</p>
        <div class="cycle-id">Cycle ID: 0x8F4A2B1C</div>
    </div>
</body>
</html>
