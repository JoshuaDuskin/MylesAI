name: Validate MYLES Runtime

on:
  push:
    paths:
      - "*.py"
      - "*.cmd"
      - "*.ps1"
      - "dashboard_bridge/**"
      - "quant/**"
      - "bin/**"
      - "tests/**"
      - "index.html"
      - ".github/workflows/validate-runtime.yml"
  pull_request:
    paths:
      - "*.py"
      - "*.cmd"
      - "*.ps1"
      - "dashboard_bridge/**"
      - "quant/**"
      - "bin/**"
      - "tests/**"
      - "index.html"
      - ".github/workflows/validate-runtime.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Compile Python runtime
        run: python -m py_compile dashboard_bridge/guest_chat.py dashboard_bridge/dashboard_bridge.py bin/runtime_supervisor_v074.py bin/public_gateway_v074.py bin/game_mode_watch.py bin/ensure_myles_runtime.py bin/remote_deploy_agent.py bin/tower_reporting_connect.py bin/intelligence_baseline.py bin/tower_health_issue.py bin/verified_release.py bin/remote_deploy_smoketest.py bin/acceptance_windows.py myles_core.py myles_game_guard.py myles_conversation.py myles_visual_verify.py myles_assisted.py myles_interactive.py myles_agent_contracts.py myles_evidence.py myles_model_runtime.py myles_windows.py myles_tools.py job_worker.py

      - name: Verify durable Windows startup contract
        shell: bash
        run: |
          test -f bin/ensure_myles_runtime.py
          test ! -f bin/ensure_myles_runtime.ps1
          grep -q "MylesAIRuntimeGuardian" UPDATE_TOWER.ps1
          grep -q "MylesAI Runtime Guardian" UPDATE_TOWER.ps1
          grep -q "RepetitionInterval" UPDATE_TOWER.ps1
          grep -q 'New-ScheduledTaskAction -Execute $PythonW' UPDATE_TOWER.ps1
          grep -q "runtime_supervisor_v074.py" bin/ensure_myles_runtime.py
          grep -q "consecutive_failures" bin/ensure_myles_runtime.py
          grep -q 'Git metadata is missing; preparing a recoverable canonical checkout' UPDATE_TOWER.ps1
          grep -q 'broken Git metadata archived; preparing a recoverable canonical checkout' UPDATE_TOWER.ps1
          grep -q 'rev-parse --is-inside-work-tree' UPDATE_TOWER.ps1
          grep -q 'non_git_source_tree' UPDATE_TOWER.ps1
          ! grep -q 'TaskAction = New-ScheduledTaskAction -Execute "powershell.exe"' UPDATE_TOWER.ps1
          ! grep -q -- "-NoExit" UPDATE_TOWER.cmd UPDATE_TOWER.ps1
          ! grep -q "Launching the single owner console automatically" UPDATE_TOWER.ps1
          echo "durable startup and recovery contract OK"

      - name: Verify approval-based household device access
        run: python -m unittest discover -s tests -p test_device_access.py -v

      - name: Verify two-user full-access dashboard safety
        run: python -m unittest discover -s tests -p test_two_owner_dashboard_101511.py -v

      - name: Verify consistent phone paper and research telemetry
        run: |
          python -m unittest discover -s tests -p 'test_quant_dashboard_status.py'
          python -m unittest discover -s tests -p 'test_prediction_controls.py'
          node tests/test_dashboard_quant_status.cjs

      - name: Verify public basic app launch scope
        run: python -m unittest discover -s tests -p 'test_public*.py' -v

      - name: Verify owner phone onboarding and reconnect
        run: python -m unittest discover -s tests -p test_phone_trust_101512.py -v

      - name: Check phone password manager recovery contract
        run: python -m unittest discover -s tests -p test_password_manager_101513.py -v

      - name: Test explicit phone bridge endpoint priority
        run: python -m unittest discover -s tests -p test_bridge_url_priority_101514.py -v

      - name: Test household guest permission isolation
        run: python -m unittest discover -s tests -p test_guest_chat_permissions.py -v

      - name: Test immediate chat display and asynchronous acknowledgments
        run: |
          python -m unittest discover -s tests -p test_chat_delivery.py -v
          python -m unittest discover -s tests -p test_chat_streaming.py -v
          python -m unittest discover -s tests -p test_managed_worker_scope.py -v
          python -m unittest discover -s tests -p test_bridge_manifest_encoding.py -v
          node tests/test_chat_optimistic.cjs

      - name: Run MYLES regression self-test
        run: python self_test.py

      - name: Test guarded visual interaction
        run: python -m unittest discover -s tests -p test_interactive_assisted.py -v

      - name: Test Fortnite performance priority
        run: python -m unittest discover -s tests -p test_fortnite_priority.py -v

      - name: Test Fortnite live-process deployment block
        run: python -m unittest discover -s tests -p test_update_game_safety_101515.py -v

      - name: Test remote deployment safety gates
        run: python -m unittest discover -s tests -p test_remote_deploy.py -v

      - name: Test verified recovery and Ollama readiness diagnosis
        run: python -m unittest discover -s tests -p test_tower_recovery_10159.py -v

      - name: Test silent unchanged GitHub poll and safe console attribution
        run: python -m unittest discover -s tests -p test_quiet_git_poll.py -v

      - name: Test hidden launches and sanitized console forensics
        run: python -m unittest discover -s tests -p test_console_window_quiet.py -v

      - name: Test unattended CI-verified tower releases
        run: python -m unittest discover -s tests -p test_verified_release.py -v

      - name: Test CI receipt survival and independent post-restart recovery
        run: python -m unittest discover -s tests -p test_deployment_receipt_recovery.py -v

      - name: Test one-click authenticated tower reporting
        run: python -m unittest discover -s tests -p test_tower_reporting_connect.py -v

      - name: Test real-model and REA tower baseline contracts
        run: python -m unittest discover -s tests -p test_intelligence_baseline.py -v

      - name: Test same-repository tower health issue
        run: python -m unittest discover -s tests -p test_tower_health_issue.py -v

      - name: Test tower bootstrap smoke probe
        run: python -m unittest discover -s tests -p test_bootstrap_probe.py -v

      - name: Test direct Fortnite close and update-wrapper exit detection
        run: python -m unittest discover -s tests -p test_game_close_truth.py -v

      - name: Test owner phone chat job reports and uncut responses
        run: python -m unittest discover -s tests -p test_owner_chat_truth.py -v

      - name: Run REA-derived conversation regression matrix
        run: python -m unittest discover -s tests -p test_rea_behavior_matrix.py -v

      - name: Test REA provider failure contracts
        run: python -m unittest discover -s tests -p test_rea_capability.py -v

      - name: Test contextual memory and visual effect verification
        run: python -m unittest discover -s tests -p test_conversation_vision.py -v

      - name: Test Windows acceptance probes
        run: python -m unittest discover -s tests -p test_windows_acceptance.py -v

      - name: Verify BOM-safe pairing JSON
        run: python -c "import json,tempfile,pathlib;p=pathlib.Path(tempfile.gettempdir())/'myles_pair_bom.json';p.write_bytes(b'\\xef\\xbb\\xbf{\"code\":\"TEST1234\",\"pinned\":true,\"expires_epoch\":9999999999}');d=json.loads(p.read_text(encoding='utf-8-sig'));assert d['code']=='TEST1234' and d['pinned'] is True;print('BOM pairing JSON OK')"

      - name: Reject stale trading fallback
        shell: bash
        run: |
          ! grep -F "workspaces.rglob" dashboard_bridge/dashboard_bridge.py
          grep -F "_verified_source" dashboard_bridge/dashboard_bridge.py
          grep -F "data/trading_status.json" dashboard_bridge/dashboard_bridge.py
          grep -F "raw?._verified===true" index.html
          grep -F "data/trading_status.json" index.html
          echo "verified Quant-only dashboard path OK"

      - name: Verify automatic game-mode contract
        run: python -c "from pathlib import Path;w=Path('bin/game_mode_watch.py').read_text().lower();s=Path('bin/runtime_supervisor_v074.py').read_text();c=Path('myles_core.py').read_text();assert 'fortniteclient-win64-shipping.exe' in w;assert 'ollama' in w and 'stop_heavy_myles_processes' in w;assert 'light_mode_active' in s and 'stop_heavy_background' in s;assert 'paused_for_game' in c;print('automatic game-mode contract OK')"

      - name: Test Quant evidence gate and persistent risk stops
        run: python -m unittest discover -s tests -p test_quant_paper_safety.py -v

      - name: Test real-feed schemas, accounting, and worker lease recovery
        run: |
          node --test tests/quant_repair.test.mjs
          python -m unittest discover -s tests -p test_job_lease_repair.py -v

      - name: Check Quant syntax
        run: node --check quant/quant_service.mjs

      - name: Check Quant copy-trader syntax
        run: node --check quant/copy_trader_service.mjs

      - name: Check dashboard inline JavaScript syntax
        run: |
          node - <<'NODE'
          const fs = require('fs');
          const html = fs.readFileSync('index.html', 'utf8');
          const scripts = [...html.matchAll(/<script(?:\s[^>]*)?>([\s\S]*?)<\/script>/gi)];
          if (!scripts.length) throw new Error('No inline dashboard script found');
          new Function(scripts.at(-1)[1]);
          console.log('dashboard inline JavaScript OK');
          NODE

      - name: Run Quant self-test
        run: node quant/quant_service.mjs --self-test
      - name: Verify strict dashboard trading source
        run: |
          grep -q "data/trading_status.json" index.html
          grep -q "SIMULATED PAPER" index.html
          ! grep -q "paper_equity','balance','paper_balance" index.html
          grep -q "data-chart-funds" index.html
          grep -q "chart-funds-controls" index.html

      - name: Reject stale or simulated dashboard artifacts
        shell: bash
        run: |
          ! test -e status.json
          ! test -e data-feed.json
          ! test -e feed_data.js
          ! test -e status_logic.js
          ! test -e status_server.py
          ! test -e dashboard.html
          ! test -e myles_dashboard/index.html
          ! test -e myles_dashboard/run_dashboard.py
          ! test -e public-dashboard/index.html
          ! test -e index_final.html
          ! test -e app.py
          ! test -e server.py
          ! grep -q "NOT PUBLISHED" index.html
          ! grep -q "937d" index.html
          grep -q "Published status fallback is legacy or stale" index.html
          grep -q "timeout:20000" index.html
          grep -q "/api/public-status" index.html
          echo "dashboard truth-only contract OK"

      - name: Verify GMX resilient feed contract
        shell: bash
        run: |
          grep -q "arbitrum.gmxapi.io/v1" quant/research_providers.mjs
          grep -q "arbitrum.gmxapi.ai/v1" quant/research_providers.mjs
          grep -q "/markets/tickers" quant/research_providers.mjs
          grep -q "Promise.all(enabled.map" quant/quant_service.mjs
          grep -q "arbitrum-api-fallback.gmxinfra.io" dashboard_bridge/dashboard_bridge.py
          grep -q "_verified_source.*data/trading_status.json" bin/public_gateway_v074.py
          node --check quant/gmx_live.mjs
          node --check quant/copy_trader_service.mjs
          grep -q "COPY_STATUS_FILE" quant/quant_service.mjs
          grep -q "copy_traders" quant/quant_service.mjs
          echo "GMX fallback and gateway telemetry contract OK"
