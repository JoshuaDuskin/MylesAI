name: Validate MYLES Runtime

on:
  push:
    paths:
      - "dashboard_bridge/**/*.py"
      - "quant/**/*.mjs"
      - ".github/workflows/validate-runtime.yml"
  pull_request:
    paths:
      - "dashboard_bridge/**/*.py"
      - "quant/**/*.mjs"
      - ".github/workflows/validate-runtime.yml"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Compile bridge
        run: python -m py_compile dashboard_bridge/dashboard_bridge.py
      - name: Check Quant syntax
        run: node --check quant/quant_service.mjs
      - name: Run Quant self-test
        run: node quant/quant_service.mjs --self-test
