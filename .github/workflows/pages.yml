name: Deploy MYLES Dashboard

on:
  push:
    branches:
      - main
    paths:
      - "index.html"
      - "bridge.json"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: "pages"
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      # Publishing must fail if an edit replaces the dashboard with a placeholder.
      # Runtime validation is a separate workflow and cannot protect Pages itself.
      - name: Verify dashboard before publishing
        run: |
          node tests/test_dashboard_quant_status.cjs
          node tests/test_chat_optimistic.cjs

      - name: Prepare dashboard artifact
        shell: bash
        run: |
          mkdir -p _site
          cp index.html _site/index.html
          cp bridge.json _site/bridge.json
          touch _site/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
          path: _site

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
        with:
          artifact_name: github-pages-${{ github.run_id }}-${{ github.run_attempt }}
