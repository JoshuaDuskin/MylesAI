<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myles AI Worker Status Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --success: #22c55e;
            --warning: #eab308;
            --error: #ef4444;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            font-family: 'Segoe UI', system-ui, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            min-height: 100vh;
            display: flex;
            flex-direction: column;
        }

        header {
            background: rgba(30, 41, 59, 0.8);
            backdrop-filter: blur(10px);
            border-bottom: 1px solid var(--border);
            padding: 1rem 2rem;
            display: flex;
            justify-content: space-between;
            align-items: center;
            position: sticky;
            top: 0;
            z-index: 100;
        }

        h1 { font-size: 1.5rem; font-weight: 600; letter-spacing: -0.025em; }

        .status-badge {
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
            padding: 0.5rem 1rem;
            border-radius: 999px;
            font-size: 0.875rem;
            font-weight: 600;
            background: rgba(255, 255, 255, 0.05);
            border: 1px solid var(--border);
        }

        .pulse-dot {
            width: 8px;
            height: 8px;
            border-radius: 50%;
            background-color: var(--success);
            box-shadow: 0 0 0 rgba(34, 197, 94, 0.4);
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0.7); }
            70% { transform: scale(1); box-shadow: 0 0 0 10px rgba(34, 197, 94, 0); }
            100% { transform: scale(0.95); box-shadow: 0 0 0 0 rgba(34, 197, 94, 0); }
        }

        main {
            flex: 1;
            padding: 2rem;
            max-width: 1600px;
            margin: 0 auto;
            width: 100%;
        }

        .grid {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(300px, 1fr));
            gap: 1.5rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border);
            border-radius: 0.75rem;
            padding: 1.25rem;
            transition: transform 0.2s, box-shadow 0.2s;
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
            border-color: var(--accent);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.5rem;
        }

        .worker-name { font-weight: 600; font-size: 1.1rem; }
        
        .status-indicator {
            width: 10px;
            height: 10px;
            border-radius: 50%;
            background-color: var(--success);
        }

        .status-indicator.offline { background-color: var(--error); box-shadow: none; }
        .status-indicator.warning { background-color: var(--warning); }

        .stats-row {
            display: flex;
            justify-content: space-between;
            font-size: 0.875rem;
            color: var(--text-secondary);
            padding-top: 0.5rem;
            border-top: 1px solid rgba(255,255,255,0.05);
        }

        .stat-value { font-weight: 600; color: var(--text-primary); }

        .last-update {
            margin-top: auto;
            padding-top: 1rem;
            font-size: 0.75rem;
            color: var(--text-secondary);
            text-align: center;
        }

        .loading-overlay {
            position: fixed;
            inset: 0;
            background: rgba(15, 23, 42, 0.9);
            display: flex;
            justify-content: center;
            align-items: center;
            z-index: 1000;
            transition: opacity 0.3s;
        }

        .spinner {
            width: 48px;
            height: 48px;
            border: 4px solid var(--border);
            border-top-color: var(--accent);
            border-radius: 50%;
            animation: spin 1s linear infinite;
        }

        @keyframes spin { to { transform: rotate(360deg); } }

        .hidden { opacity: 0; pointer-events: none; }
    </style>
</head>
<body>

    <header>
        <h1>Myles AI Core Status</h1>
        <div class="status-badge">
            <div class="pulse-dot" id="global-status-dot"></div>
            <span id="global-status-text">Connecting...</span>
        </div>
    </header>

    <main>
        <div id="grid-container" class="grid">
            <!-- Worker Cards injected here -->
        </div>
        <div id="loading-overlay" class="loading-overlay">
            <div class="spinner"></div>
        </div>
    </main>

    <script>
        // Configuration
        const CONFIG = {
            apiEndpoint: window.MYLES_RAW_STATUS_URL || 'http://localhost:8080/api/status',
            refreshInterval: 3000, // ms
            maxRetries: 3
        };

        // State
        let lastData = null;
        let retryCount = 0;

        // DOM Elements
        const gridContainer = document.getElementById('grid-container');
        const loadingOverlay = document.getElementById('loading-overlay');
        const globalStatusText = document.getElementById('global-status-text');
        const globalStatusDot = document.getElementById('global-status-dot');

        /**
         * Fetches raw status data from the Myles core.
         */
        async function fetchStatus() {
            try {
                const response = await fetch(CONFIG.apiEndpoint);
                
                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                return data;
            } catch (error) {
                console.warn(`Fetch failed: ${error.message}. Retrying...`);
                retryCount++;
                
                if (retryCount < CONFIG.maxRetries) {
                    setTimeout(fetchStatus, 2000 * retryCount);
                } else {
                    throw error;
                }
            }
        }

        /**
         * Renders the dashboard based on fetched data.
         */
        function renderDashboard(data) {
            if (!data.workers || !Array.isArray(data.workers)) {
                console.error('Invalid worker data structure');
                return;
            }

            // Update Global Status
            const isOnline = data.status === 'online' || data.status === 'healthy';
            globalStatusText.textContent = isOnline ? 'System Online' : 'System Offline';
            
            if (isOnline) {
                globalStatusDot.className = 'pulse-dot';
                globalStatusDot.style.backgroundColor = 'var(--success)';
            } else {
                globalStatusDot.className = '';
                globalStatusDot.style.backgroundColor = 'var(--error)';
            }

            // Clear existing cards
            gridContainer.innerHTML = '';

            // Create cards for each worker
            data.workers.forEach(worker => {
                const card = document.createElement('div');
                card.className = 'card';
                
                // Determine status class and text
                let statusClass = 'online';
                let statusText = 'Active';
                let color = 'var(--success)';

                if (worker.status === 'idle') {
                    statusClass = 'warning';
                    statusText = 'Idle';
                    color = 'var(--warning)';
                } else if (worker.status === 'offline' || !worker.status) {
                    statusClass = 'offline';
                    statusText = 'Offline';
                    color = 'var(--error)';
                }

                // Format memory usage
                const memUsage = worker.memory ? formatBytes(worker.memory.used) : '-';
                const cpuUsage = worker.cpu ? `${worker.cpu}%` : '-';

                card.innerHTML = `
                    <div class="card-header">
                        <span class="worker-name">${escapeHtml(worker.name || 'Unknown Worker')}</span>
                        <div class="status-indicator ${statusClass}" style="background-color: ${color}"></div>
                    </div>
                    <div class="stats-row">
                        <span>CPU Load:</span>
                        <span class="stat-value" style="color: ${color}">${cpuUsage}</span>
                    </div>
                    <div class="stats-row">
                        <span>Memory:</span>
                        <span class="stat-value" style="color: ${color}">${memUsage}</span>
                    </div>
                    <div class="last-update">
                        Last Heartbeat: ${formatTime(worker.last_seen || new Date())}
                    </div>
                `;

                gridContainer.appendChild(card);
            });

            // Hide loading overlay if it's still visible
            if (loadingOverlay.classList.contains('hidden') === false) {
                loadingOverlay.classList.add('hidden');
            }
        }

        /**
         * Helper: Format bytes to human readable string.
         */
        function formatBytes(bytes, decimals = 2) {
            if (!+bytes) return '0 Bytes';
            const k = 1024;
            const dm = decimals < 0 ? 0 : decimals;
            const sizes = ['Bytes', 'KB', 'MB', 'GB', 'TB'];
            const i = Math.floor(Math.log(bytes) / Math.log(k));
            return `${parseFloat((bytes / Math.pow(k, i)).toFixed(dm))} ${sizes[i]}`;
        }

        /**
         * Helper: Format timestamp.
         */
        function formatTime(dateString) {
            const date = new Date(dateString);
            return date.toLocaleTimeString([], { hour: '2-digit', minute: '2-digit', second: '2-digit' });
        }

        /**
         * Helper: Escape HTML to prevent XSS.
         */
        function escapeHtml(text) {
            if (text === null || text === undefined) return '';
            const map = {
                '&': '&amp;',
                '<': '&lt;',
                '>': '&gt;',
                '"': '&quot;',
                "'": '&#039;'
            };
            return String(text).replace(/[&<>"']/g, function(m) { return map[m]; });
        }

        /**
         * Initialize Dashboard
         */
        async function init() {
            try {
                const data = await fetchStatus();
                renderDashboard(data);
                
                // Start polling loop
                setInterval(fetchStatus, CONFIG.refreshInterval);
            } catch (error) {
                console.error('Failed to initialize dashboard:', error);
                globalStatusText.textContent = 'Connection Failed';
                globalStatusDot.style.backgroundColor = 'var(--error)';
                gridContainer.innerHTML = '<div style="grid-column: 1/-1; text-align: center; padding: 2rem;">Unable to connect to Myles Core. Please check your network or API endpoint.</div>';
            }
        }

        // Start the application
        init();
    </script>
</body>
</html>
