<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Myles AI Dashboard</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --text-primary: #f8fafc;
            --text-secondary: #94a3b8;
            --accent: #38bdf8;
            --success: #4ade80;
            --warning: #fbbf24;
            --danger: #f87171;
            --font-family: 'Segoe UI', Roboto, Helvetica, Arial, sans-serif;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; }

        body {
            background-color: var(--bg-color);
            color: var(--text-primary);
            font-family: var(--font-family);
            height: 100vh;
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        header {
            background-color: var(--card-bg);
            padding: 1rem 2rem;
            border-bottom: 1px solid #334155;
            display: flex;
            justify-content: space-between;
            align-items: center;
            box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.1);
        }

        h1 { font-size: 1.5rem; font-weight: 700; letter-spacing: -0.025em; }
        .status-badge {
            background-color: rgba(74, 222, 128, 0.2);
            color: var(--success);
            padding: 0.25rem 0.75rem;
            border-radius: 9999px;
            font-size: 0.875rem;
            font-weight: 600;
            display: inline-flex;
            align-items: center;
            gap: 0.5rem;
        }

        .pulse {
            width: 8px;
            height: 8px;
            background-color: var(--success);
            border-radius: 50%;
            animation: pulse 2s infinite;
        }

        @keyframes pulse {
            0% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0.7); }
            70% { box-shadow: 0 0 0 10px rgba(74, 222, 128, 0); }
            100% { box-shadow: 0 0 0 0 rgba(74, 222, 128, 0); }
        }

        main {
            flex: 1;
            padding: 2rem;
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 1.5rem;
            overflow-y: auto;
        }

        .card {
            background-color: var(--card-bg);
            border-radius: 0.75rem;
            padding: 1.5rem;
            border: 1px solid #334155;
            display: flex;
            flex-direction: column;
            transition: transform 0.2s ease, box-shadow 0.2s ease;
        }

        .card:hover {
            transform: translateY(-2px);
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.3);
        }

        .card-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 1rem;
            color: var(--text-secondary);
            font-size: 0.875rem;
            text-transform: uppercase;
            letter-spacing: 0.05em;
        }

        .metric-value {
            font-size: 2.5rem;
            font-weight: 700;
            margin-bottom: 0.5rem;
            color: var(--text-primary);
        }

        .metric-change {
            font-size: 0.875rem;
            display: flex;
            align-items: center;
            gap: 0.25rem;
        }

        .trend-up { color: var(--success); }
        .trend-down { color: var(--danger); }

        .chart-container {
            flex: 1;
            position: relative;
            margin-top: 1rem;
            min-height: 150px;
        }

        canvas {
            width: 100%;
            height: 100%;
        }

        .log-feed {
            font-family: 'Consolas', 'Monaco', monospace;
            font-size: 0.75rem;
            color: var(--text-secondary);
            max-height: 200px;
            overflow-y: auto;
            border-top: 1px solid #334155;
            padding-top: 0.5rem;
        }

        .log-entry { margin-bottom: 0.25rem; opacity: 0.8; }
        .log-entry span { color: var(--accent); }

        /* Scrollbar styling */
        ::-webkit-scrollbar { width: 8px; }
        ::-webkit-scrollbar-track { background: var(--bg-color); }
        ::-webkit-scrollbar-thumb { background: #334155; border-radius: 4px; }
        ::-webkit-scrollbar-thumb:hover { background: #475569; }

        @media (max-width: 768px) {
            main { grid-template-columns: 1fr; padding: 1rem; }
            .metric-value { font-size: 2rem; }
        }
    </style>
</head>
<body>

<header>
    <div style="display:flex; align-items:center; gap:1rem;">
        <svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#38bdf8" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
        </svg>
        <h1>Myles AI Dashboard</h1>
    </div>
    <div class="status-badge">
        <div class="pulse"></div>
        System Operational
    </div>
</header>

<main id="dashboard-grid">
    <!-- Cards will be injected here by JS -->
</main>

<script>
    /**
     * Myles Dashboard Logic
     * Generates simulated random walk data and renders it in real-time.
     */

    // Configuration
    const CONFIG = {
        updateInterval: 1000, // ms
        chartCount: 5,
        maxDataPoints: 60, // ~1 minute of history at 1s interval
        metrics: [
            { id: 'cpu', label: 'CPU Load', unit: '%', base: 45, volatility: 15 },
            { id: 'mem', label: 'Memory Usage', unit: '%', base: 60, volatility: 10 },
            { id: 'net_in', label: 'Network In', unit: 'MB/s', base: 12, volatility: 8 },
            { id: 'net_out', label: 'Network Out', unit: 'MB/s', base: 5, volatility: 4 },
            { id: 'temp', label: 'Core Temp', unit: '°C', base: 65, volatility: 3 }
        ]
    };

    // State Management
    const state = {};

    // Initialize State
    function init() {
        const grid = document.getElementById('dashboard-grid');
        
        CONFIG.metrics.forEach(metric => {
            // Generate initial history for smooth start
            let history = [];
            let currentVal = metric.base;
            
            for(let i=0; i<CONFIG.maxDataPoints; i++) {
                currentVal += (Math.random() - 0.5) * metric.volatility;
                history.push(currentVal);
            }

            state[metric.id] = {
                label: metric.label,
                unit: metric.unit,
                base: metric.base,
                volatility: metric.volatility,
                history: history,
                currentValue: currentVal,
                trend: 0 // 1 up, -1 down, 0 flat
            };

            // Create Card HTML
            const card = document.createElement('div');
            card.className = 'card';
            card.id = `card-${metric.id}`;
            card.innerHTML = `
                <div class="card-header">
                    <span>${metric.label}</span>
                    <span style="font-size:0.75rem; opacity:0.6;">Live Feed</span>
                </div>
                <div class="metric-value" id="val-${metric.id}">${currentVal.toFixed(1)} ${metric.unit}</div>
                <div class="metric-change" id="trend-${metric.id}">
                    <span class="trend-neutral">--</span>
                </div>
                <div class="chart-container">
                    <canvas id="chart-${metric.id}"></canvas>
                </div>
                <div class="log-feed" id="log-${metric.id}"></div>
            `;
            grid.appendChild(card);

            // Initialize Chart Canvas
            const canvas = document.getElementById(`chart-${metric.id}`);
            const ctx = canvas.getContext('2d');
            
            // Handle High DPI displays
            function resizeCanvas() {
                const rect = canvas.getBoundingClientRect();
                canvas.width = rect.width * window.devicePixelRatio;
                canvas.height = rect.height * window.devicePixelRatio;
                ctx.scale(window.devicePixelRatio, window.devicePixelRatio);
            }
            window.addEventListener('resize', resizeCanvas);
            resizeCanvas();

            // Draw initial chart
            drawChart(ctx, metric.id, history);
            
            // Initialize log
            const logEl = document.getElementById(`log-${metric.id}`);
            for(let i=0; i<5; i++) {
                addLogEntry(logEl, metric.id);
            }
        });

        // Start Loop
        setInterval(updateDashboard, CONFIG.updateInterval);
    }

    // Core Update Function
    function updateDashboard() {
        CONFIG.metrics.forEach(metric => {
            // 1. Generate Random Walk Value
            const change = (Math.random() - 0.5) * metric.volatility;
            let newVal = metric.currentValue + change;
            
            // Keep within reasonable bounds (e.g., 0-100 for %, or min/max for others)
            if (metric.id === 'cpu' || metric.id === 'mem') {
                newVal = Math.max(0, Math.min(100, newVal));
            } else if (metric.id === 'temp') {
                newVal = Math.max(30, Math.min(105, newVal));
            }

            // 2. Update State
            metric.currentValue = newVal;
            
            // 3. Calculate Trend
            const prevVal = metric.history[metric.history.length - 1];
            if (newVal > prevVal) {
                metric.trend = 1;
            } else if (newVal < prevVal) {
                metric.trend = -1;
            } else {
                metric.trend = 0;
            }

            // 4. Update History Array (Shift and push)
            metric.history.shift();
            metric.history.push(newVal);

            // 5. Render Updates
            updateDOM(metric.id, newVal, metric.trend);
        });
    }

    // DOM Updates
    function updateDOM(id, value, trend) {
        const valEl = document.getElementById(`val-${id}`);
        const trendEl = document.getElementById(`trend-${id}`);
        const canvas = document.getElementById(`chart-${id}`);
        const ctx = canvas.getContext('2d');
        const logEl = document.getElementById(`log-${id}`);

        // Update Text
        valEl.textContent = value.toFixed(1) + ' ' + CONFIG.metrics.find(m => m.id === id).unit;
        
        // Update Trend Indicator
        if (trend > 0) {
            trendEl.innerHTML = `<span class="trend-up">▲</span> <span>+${((value - metric.history[metric.history.length-2]) / metric.history[metric.history.length-2] * 100).toFixed(1)}%</span>`;
        } else if (trend < 0) {
            trendEl.innerHTML = `<span class="trend-down">▼</span> <span>${((value - metric.history[metric.history.length-2]) / metric.history[metric.history.length-2] * 100).toFixed(1)}%</span>`;
        } else {
            trendEl.innerHTML = `<span class="trend-neutral">-</span> <span>Stable</span>`;
        }

        // Update Chart
        drawChart(ctx, id, metric.history);

        // Update Log (Add new entry, remove old ones if too many)
        addLogEntry(logEl, id);
    }

    // Draw Line Chart
    function drawChart(ctx, id, data) {
        const width = ctx.canvas.width / ctx.canvas.getContext('devicePixelRatio');
        const height = ctx.canvas.height / ctx.canvas.getContext('devicePixelRatio');
        
        ctx.clearRect(0, 0, width, height);

        // Find min/max for scaling
        let min = Math.min(...data);
        let max = Math.max(...data);
        const padding = (max - min) * 0.1;
        min -= padding;
        max += padding;
        const range = max - min;

        // Draw Grid Lines
        ctx.strokeStyle = '#334155';
        ctx.lineWidth = 1;
        ctx.beginPath();
        for(let i=0; i<4; i++) {
            const y = height - ((i / 3) * height);
            ctx.moveTo(0, y);
            ctx.lineTo(width, y);
        }
        ctx.stroke();

        // Draw Line
        ctx.beginPath();
        const stepX = width / (CONFIG.maxDataPoints - 1);
        
        data.forEach((val, index) => {
            const x = index * stepX;
            const y = height - ((val - min) / range) * height;
            
            if (index === 0) ctx.moveTo(x, y);
            else ctx.lineTo(x, y);
        });

        // Gradient Fill
        const gradient = ctx.createLinearGradient(0, 0, 0, height);
        gradient.addColorStop(0, 'rgba(56, 189, 248, 0.2)');
        gradient.addColorStop(1, 'rgba(56, 189, 248, 0)');
        
        ctx.fillStyle = gradient;
        ctx.fill();

        // Stroke
        ctx.strokeStyle = '#38bdf8';
        ctx.lineWidth = 2;
        ctx.lineJoin = 'round';
        ctx.stroke();

        // Draw Points (every 5th point for performance)
        ctx.fillStyle = '#fff';
        data.forEach((val, index) => {
            if (index % 5 === 0) {
                const x = index * stepX;
                const y = height - ((val - min) / range) * height;
                ctx.beginPath();
                ctx.arc(x, y, 3, 0, Math.PI * 2);
                ctx.fill();
            }
        });
    }

    // Log Feed Helper
    function addLogEntry(container, id) {
        const now = new Date();
        const timeStr = now.toLocaleTimeString([], { hour12: false, hour: '2-digit', minute:'2-digit', second:'2-digit' });
        
        const entry = document.createElement('div');
        entry.className = 'log-entry';
        // Simulate a log message based on metric type
        let msg = `Update received for ${id}`;
        if (Math.random() > 0.7) msg += " - Anomaly detected in random walk.";
        
        entry.innerHTML = `<span>[${timeStr}]</span> ${msg}`;
        
        container.prepend(entry);
        
        // Keep only last 10 entries
        if (container.children.length > 10) {
            container.removeChild(container.lastChild
