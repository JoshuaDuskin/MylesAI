<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Berlin Weather Dashboard</title>
    <style>
        :root {
            --bg-color: #f4f7f6;
            --card-bg: #ffffff;
            --text-primary: #333333;
            --text-secondary: #666666;
            --accent-color: #007bff;
            --error-color: #dc3545;
            --success-color: #28a745;
        }

        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background-color: var(--bg-color);
            color: var(--text-primary);
            margin: 0;
            padding: 20px;
            display: flex;
            justify-content: center;
            min-height: 100vh;
        }

        .dashboard-container {
            width: 100%;
            max-width: 800px;
            background-color: var(--card-bg);
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 30px;
        }

        header {
            text-align: center;
            margin-bottom: 30px;
            border-bottom: 2px solid #eee;
            padding-bottom: 20px;
        }

        h1 {
            margin: 0;
            font-size: 2rem;
            color: var(--text-primary);
        }

        .location-info {
            margin-top: 10px;
            color: var(--text-secondary);
            font-size: 1.1rem;
        }

        .weather-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .weather-card {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            text-align: center;
            border: 1px solid #e9ecef;
            transition: transform 0.2s ease;
        }

        .weather-card:hover {
            transform: translateY(-5px);
            box-shadow: 0 4px 8px rgba(0,0,0,0.1);
        }

        .weather-icon {
            font-size: 3rem;
            margin-bottom: 10px;
        }

        .weather-value {
            font-size: 1.5rem;
            font-weight: bold;
            color: var(--text-primary);
        }

        .weather-label {
            font-size: 0.9rem;
            color: var(--text-secondary);
            text-transform: uppercase;
            letter-spacing: 1px;
        }

        .details-section {
            background-color: #f8f9fa;
            border-radius: 8px;
            padding: 20px;
            margin-top: 20px;
        }

        .details-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(150px, 1fr));
            gap: 15px;
        }

        .detail-item {
            text-align: center;
        }

        .detail-value {
            font-weight: bold;
            color: var(--accent-color);
        }

        .error-message {
            background-color: #f8d7da;
            color: var(--error-color);
            padding: 20px;
            border-radius: 8px;
            text-align: center;
            font-weight: bold;
            display: none;
        }

        .loading {
            text-align: center;
            padding: 40px;
            color: var(--text-secondary);
            font-style: italic;
        }

        @media (max-width: 600px) {
            body {
                padding: 10px;
            }
            .dashboard-container {
                padding: 15px;
            }
        }
    </style>
</head>
<body>

<div class="dashboard-container">
    <header>
        <h1>Berlin Weather</h1>
        <div class="location-info" id="location-text">Loading location data...</div>
    </header>

    <div id="error-box" class="error-message"></div>
    <div id="loading-box" class="loading">Fetching weather data from Open-Meteo...</div>
    
    <div id="weather-content" style="display: none;">
        <div class="weather-grid">
            <div class="weather-card">
                <div class="weather-icon" id="icon-main">☀️</div>
                <div class="weather-value" id="temp-current">--°C</div>
                <div class="weather-label">Current Temp</div>
            </div>
            <div class="weather-card">
                <div class="weather-icon" id="icon-wind">🌬️</div>
                <div class="weather-value" id="wind-speed">-- km/h</div>
                <div class="weather-label">Wind Speed</div>
            </div>
            <div class="weather-card">
                <div class="weather-icon" id="icon-humidity">💧</div>
                <div class="weather-value" id="humidity">--%</div>
                <div class="weather-label">Humidity</div>
            </div>
            <div class="weather-card">
                <div class="weather-icon" id="icon-pressure">⚖️</div>
                <div class="weather-value" id="pressure">-- hPa</div>
                <div class="weather-label">Pressure</div>
            </div>
        </div>

        <div class="details-section">
            <h3 style="margin-top: 0; color: var(--text-secondary);">Additional Details</h3>
            <div class="details-grid">
                <div class="detail-item">
                    <div class="weather-label">UV Index</div>
                    <div class="detail-value" id="uv-index">--</div>
                </div>
                <div class="detail-item">
                    <div class="weather-label">Visibility</div>
                    <div class="detail-value" id="visibility">-- km</div>
                </div>
                <div class="detail-item">
                    <div class="weather-label">Cloud Cover</div>
                    <div class="detail-value" id="cloud-cover">--%</div>
                </div>
                <div class="detail-item">
                    <div class="weather-label">Sunrise</div>
                    <div class="detail-value" id="sunrise">--:--</div>
                </div>
                <div class="detail-item">
                    <div class="weather-label">Sunset</div>
                    <div class="detail-value" id="sunset">--:--</div>
                </div>
            </div>
        </div>
    </div>
</div>

<script>
    // Configuration for Berlin
    const LAT = 52.52;
    const LON = 13.40;
    
    // Open-Meteo API URL
    const API_URL = `https://api.open-meteo.com/v1/forecast?latitude=${LAT}&longitude=${LON}&current=temperature_2m,relative_humidity_2m,apparent_temperature,is_day,precipitation,rain,weather_code,wind_speed_10m,pressure_msl,cloud_cover,visibility,uv_index,weather_code&hourly=temperature_2m,relative_humidity_2m,wind_speed_10m,pressure_msl,cloud_cover,visibility,uv_index,sunrise,sunset&timezone=auto`;

    // Helper function to get weather icon based on WMO code
    function getWeatherIcon(code) {
        if (code === 0) return '☀️'; // Clear sky
        if (code >= 1 && code <= 3) return '⛅'; // Partly cloudy
        if (code >= 45 && code <= 48) return '🌫️'; // Fog
        if (code >= 51 && code <= 67) return '🌧️'; // Drizzle/Rain
        if (code >= 80 && code <= 95) return '☔'; // Showers
        if (code >= 96 && code <= 99) return '⛈️'; // Thunderstorm
        if (code >= 95 && code <= 99) return '⛈️'; // Thunderstorm
        if (code >= 100 && code <= 115) return '🌦️'; // Snow/Freezing rain
        if (code >= 116 && code <= 132) return '❄️'; // Snow fall
        if (code >= 133 && code <= 149) return '🌨️'; // Sleet
        if (code >= 150 && code <= 157) return '☁️'; // Cloudy
        if (code >= 200 && code <= 232) return '⛈️'; // Thunderstorm
        if (code >= 233 && code <= 248) return '🌧️'; // Rain/Thunderstorm
        if (code >= 260 && code <= 274) return '❄️'; // Snow showers
        if (code >= 299 && code <= 309) return '🌨️'; // Freezing fog
        return '☁️'; // Default
    }

    function formatTime(dateString) {
        const date = new Date(dateString);
        return date.toLocaleTimeString('en-US', { hour: '2-digit', minute: '2-digit' });
    }

    async function fetchWeather() {
        try {
            const response = await fetch(API_URL);
            
            if (!response.ok) {
                throw new Error(`HTTP error! status: ${response.status}`);
            }

            const data = await response.json();
            
            // Hide loading and error messages
            document.getElementById('loading-box').style.display = 'none';
            document.getElementById('error-box').style.display = 'none';
            document.getElementById('weather-content').style.display = 'block';

            // Update Location Info
            const locationName = data.location.name;
            const countryName = data.location.country;
            document.getElementById('location-text').textContent = `${locationName}, ${countryName}`;

            // Update Current Weather
            const current = data.current;
            
            // Temperature
            document.getElementById('temp-current').textContent = `${Math.round(current.temperature_2m)}°C`;
            
            // Wind Speed (convert m/s to km/h)
            document.getElementById('wind-speed').textContent = `${(current.wind_speed_10m * 3.6).toFixed(1)} km/h`;
            
            // Humidity
            document.getElementById('humidity').textContent = `${current.relative_humidity_2m}%`;
            
            // Pressure
            document.getElementById('pressure').textContent = `${Math.round(current.pressure_msl)} hPa`;

            // Update Icons and Labels based on weather code
            const iconMain = getWeatherIcon(current.weather_code);
            document.getElementById('icon-main').textContent = iconMain;
            
            // Wind Icon (simple logic)
            if (current.wind_speed_10m > 20) {
                document.getElementById('icon-wind').textContent = '🌪️';
            } else if (current.wind_speed_10m > 10) {
                document.getElementById('icon-wind').textContent = '💨';
            } else {
                document.getElementById('icon-wind').textContent = '🌬️';
            }

            // Humidity Icon
            if (current.relative_humidity_2m > 80) {
                document.getElementById('icon-humidity').textContent = '🌧️';
            } else if (current.relative_humidity_2m > 50) {
                document.getElementById('icon-humidity').textContent = '💧';
            } else {
                document.getElementById('icon-humidity').textContent = '☀️';
            }

            // Pressure Icon
            if (current.pressure_msl < 1000) {
                document.getElementById('icon-pressure').textContent = '🌪️';
            } else if (current.pressure_msl > 1025) {
                document.getElementById('icon-pressure').textContent = '❄️';
            } else {
                document.getElementById('icon-pressure').textContent = '⚖️';
            }

            // Additional Details
            document.getElementById('uv-index').textContent = current.uv_index;
            document.getElementById('visibility').textContent = `${(current.visibility / 1000).toFixed(2)} km`;
            document.getElementById('cloud-cover').textContent = `${Math.round(current.cloud_cover)}%`;

            // Sunrise/Sunset
            if (data.hourly && data.hourly.sunrise) {
                const sunriseTime = new Date(data.hourly.time[0] + 'T' + data.hourly.sunrise[0]);
                const sunsetTime = new Date(data.hourly.time[0] + 'T' + data.hourly.sunset[0]);
                
                document.getElementById('sunrise').textContent = formatTime(sunriseTime);
                document.getElementById('sunset').textContent = formatTime(sunsetTime);
            }

        } catch (error) {
            console.error("Error fetching weather data:", error);
            const errorBox = document.getElementById('error-box');
            errorBox.textContent = `Failed to load weather data: ${error.message}. Please check your internet connection.`;
            errorBox.style.display = 'block';
            document.getElementById('loading-box').style.display = 'none';
        }
    }

    // Initialize
    fetchWeather();
</script>

</body>
</html>
